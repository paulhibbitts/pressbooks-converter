enabled: true
appearance:
  theme: system
  selector: true
colors:
  primary: '#3B82F6'
  primary_hover: '#2563EB'
  primary_text: '#FFFFFF'
  accent: '#8B5CF6'
  primary_dark: '#60A5FA'
  primary_dark_hover: '#93C5FD'
  primary_dark_text: '#18181B'
  accent_dark: '#A78BFA'
  gray_preset: zinc
  gray_custom: null
fonts:
  body: inter
  body_size: medium
  code: jetbrains-mono
  code_size: medium
logo:
  image: {  }
  image_dark: {  }
  text: 'Open Reader'
  height: h-8
header:
  menu:
    -
      route: /readme
      label: ReadMe
      external: '0'
custom_favicon:
  favicon.svg:
    name: favicon.svg
    type: image/svg+xml
    size: 580
    path: user/assets/helios/favicon.svg
sidebar:
  powered_by: '0'
navigation:
  sidebar_width: 285
  toc_width: 240
  content_width: 900
  toc_start: 2
  toc_depth: 3
  toc_position: hidden
  content_when_toc_hidden: full
  breadcrumbs: false
  prev_next: true
  scroll_spy: true
versioning:
  enabled: true
  mode: explicit
  auto_detect: true
  root: null
  versions: null
  default_version: null
  current_version: null
  version_pattern: '/^(section-?\d+|part-\d+-section-\d+)/i'
  redirect_unversioned: false
  show_badge: false
  show_dropdown: false
  labels:
    section-1: Introduction
    section-2: Installation
    section-3: 'Creating Content'
    section-4: 'Publishing & Sharing'
    section-5: Customization
search:
  enabled: true
  provider: simplesearch
  keyboard_shortcut: true
  shortcut_key: k
  placeholder: 'Search reader...'
  min_chars: 2
github:
  enabled: false
  repo: null
  branch: main
  edit_link: true
  edit_text: 'Edit this page'
  path_prefix: null
htmx:
  enabled: false
body_classes: null
append_site_title: true
